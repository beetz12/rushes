name: browser-source-environment
on:
  push:
    branches: [codex/browser-production-20261022]
    paths:
      - '.github/workflows/browser-source-environment.yml'
      - 'browser/test/matrix.mjs'
      - 'browser/test/matrix-fixture.mjs'
      - 'browser/test/cold-trace.mjs'
      - 'scripts/install-test-chrome.mjs'
permissions:
  contents: read
jobs:
  source-audio:
    name: ARM explicit-none versus default source sink
    runs-on: macos-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.0
      - run: npm --prefix browser ci --no-audit --no-fund
      - run: node scripts/install-test-chrome.mjs --generation current --destination "${{ runner.temp }}/rushes-environment-chrome"
      - run: |
          brew list ffmpeg >/dev/null 2>&1 || brew install ffmpeg
          ffmpeg -version
          ffprobe -version
      - run: npm --prefix browser run build
      - name: Prepare one immutable generated input
        id: media
        env:
          RUSHES_ENVIRONMENT_INPUT: ${{ runner.temp }}/rushes-environment-input
        run: |
          node --input-type=module <<'JS'
          import * as files from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          import { matrixMedia } from './browser/test/matrix-media.mjs';
          const root = process.env.RUSHES_ENVIRONMENT_INPUT;
          await files.mkdir(root, { mode: 0o700 });
          const media = await matrixMedia(root), pins = {};
          for (const [kind, path] of Object.entries(media))
            pins[kind] = { path, sha256: createHash('sha256').update(await files.readFile(path)).digest('hex') };
          await files.writeFile(`${root}/pins.json`, JSON.stringify(pins), { flag: 'wx' });
          JS
          echo "RUSHES_M1_SOURCE_FILE=${{ runner.temp }}/rushes-environment-input/timecoded.mjpeg" >> "$GITHUB_ENV"
      - name: Preserve each source verdict and require retirement between arms
        timeout-minutes: 9
        env:
          RUSHES_M1_SOURCE_MODE: native-reference
          RUSHES_M1_BROWSER_MODE: headful
          RUSHES_M1_VIDEO_BUFFER: cpu
          RUSHES_M1_SOURCE_AUDIO_FRAMES: '128'
          RUSHES_M1_NATIVE_SOURCE_ONLY: '1'
          RUSHES_ENVIRONMENT_PROOF: ${{ runner.temp }}/rushes-source-audio
        run: |
          aggregate=0
          for arm in none default none-traced default-traced; do
            export RUSHES_M1_PROOF="$RUSHES_ENVIRONMENT_PROOF/$arm"
            mkdir -p "$RUSHES_M1_PROOF"
            unset RUSHES_M1_SOURCE_AUDIO_TRACE_PROOF
            export RUSHES_M1_SOURCE_AUDIO_SINK=none
            if [[ "$arm" == default* ]]; then export RUSHES_M1_SOURCE_AUDIO_SINK=default; fi
            if [[ "$arm" == *-traced ]]; then export RUSHES_M1_SOURCE_AUDIO_TRACE_PROOF=1; fi
            set +e
            node browser/test/matrix.mjs
            verdict=$?
            set -e
            echo "$verdict" > "$RUSHES_M1_PROOF/command.exit"
            node verification/browser-retirement.mjs "$RUSHES_M1_PROOF/owned-browser-pid.json" "$RUSHES_M1_PROOF/retirement.json"
            if [ "$verdict" != 0 ]; then aggregate=1; fi
          done
          exit "$aggregate"
      - name: Confirm immutable input after observation
        if: ${{ !cancelled() && steps.media.conclusion == 'success' }}
        env:
          RUSHES_ENVIRONMENT_INPUT: ${{ runner.temp }}/rushes-environment-input
        run: |
          node --input-type=module <<'JS'
          import * as files from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          import assert from 'node:assert/strict';
          const pins = JSON.parse(await files.readFile(`${process.env.RUSHES_ENVIRONMENT_INPUT}/pins.json`, 'utf8'));
          for (const row of Object.values(pins))
            assert.equal(createHash('sha256').update(await files.readFile(row.path)).digest('hex'), row.sha256);
          JS
      - name: Retain bounded generated source audio evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: arm-native-source-sink
          retention-days: 1
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/rushes-environment-chrome/release.json
            ${{ runner.temp }}/rushes-environment-input/pins.json
            ${{ runner.temp }}/rushes-source-audio/*/metrics.json
            ${{ runner.temp }}/rushes-source-audio/*/command.exit
            ${{ runner.temp }}/rushes-source-audio/*/retirement.json
            ${{ runner.temp }}/rushes-source-audio/*/owned-browser-pid.json
            ${{ runner.temp }}/rushes-source-audio/*/supplied-reference.f32le
            ${{ runner.temp }}/rushes-source-audio/*/chrome-stderr.log
            ${{ runner.temp }}/rushes-source-audio/*/native-trace/report.json
            ${{ runner.temp }}/rushes-source-audio/*/native-trace/trace.json
  intel-environment:
    name: Standard Intel Mac source and recorder control
    runs-on: macos-26-intel
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.0
      - run: npm --prefix browser ci --no-audit --no-fund
      - run: node scripts/install-test-chrome.mjs --generation current --destination "${{ runner.temp }}/rushes-environment-chrome"
      - run: |
          brew list ffmpeg >/dev/null 2>&1 || brew install ffmpeg
          ffmpeg -version
          ffprobe -version
      - run: npm --prefix browser run build
      - name: Prepare one immutable generated input
        id: media
        env:
          RUSHES_ENVIRONMENT_INPUT: ${{ runner.temp }}/rushes-environment-input
        run: |
          node --input-type=module <<'JS'
          import * as files from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          import { matrixMedia } from './browser/test/matrix-media.mjs';
          const root = process.env.RUSHES_ENVIRONMENT_INPUT;
          await files.mkdir(root, { mode: 0o700 });
          const media = await matrixMedia(root), pins = {};
          for (const [kind, path] of Object.entries(media))
            pins[kind] = { path, sha256: createHash('sha256').update(await files.readFile(path)).digest('hex') };
          await files.writeFile(`${root}/pins.json`, JSON.stringify(pins), { flag: 'wx' });
          JS
          echo "RUSHES_M1_SOURCE_FILE=${{ runner.temp }}/rushes-environment-input/timecoded.mjpeg" >> "$GITHUB_ENV"
      - name: Source-only and full recorder use the same inputs and retain their verdicts
        timeout-minutes: 6
        env:
          RUSHES_M1_SOURCE_MODE: native-reference
          RUSHES_M1_BROWSER_MODE: headful
          RUSHES_M1_VIDEO_BUFFER: cpu
          RUSHES_M1_SOURCE_AUDIO_FRAMES: '128'
          RUSHES_ENVIRONMENT_PROOF: ${{ runner.temp }}/rushes-intel-environment
        run: |
          aggregate=0
          for arm in source loaded; do
            export RUSHES_M1_PROOF="$RUSHES_ENVIRONMENT_PROOF/$arm"
            mkdir -p "$RUSHES_M1_PROOF"
            unset RUSHES_M1_NATIVE_SOURCE_ONLY
            if [ "$arm" = source ]; then export RUSHES_M1_NATIVE_SOURCE_ONLY=1; fi
            set +e
            node browser/test/matrix.mjs
            verdict=$?
            set -e
            echo "$verdict" > "$RUSHES_M1_PROOF/command.exit"
            node verification/browser-retirement.mjs "$RUSHES_M1_PROOF/owned-browser-pid.json" "$RUSHES_M1_PROOF/retirement.json"
            if [ "$verdict" != 0 ]; then aggregate=1; fi
          done
          exit "$aggregate"
      - name: Confirm immutable input after observation
        if: ${{ !cancelled() && steps.media.conclusion == 'success' }}
        env:
          RUSHES_ENVIRONMENT_INPUT: ${{ runner.temp }}/rushes-environment-input
        run: |
          node --input-type=module <<'JS'
          import * as files from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          import assert from 'node:assert/strict';
          const pins = JSON.parse(await files.readFile(`${process.env.RUSHES_ENVIRONMENT_INPUT}/pins.json`, 'utf8'));
          for (const row of Object.values(pins))
            assert.equal(createHash('sha256').update(await files.readFile(row.path)).digest('hex'), row.sha256);
          JS
      - name: Retain bounded generated Intel environment evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: intel-native-environment
          retention-days: 1
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/rushes-environment-chrome/release.json
            ${{ runner.temp }}/rushes-environment-input/pins.json
            ${{ runner.temp }}/rushes-intel-environment/*/metrics.json
            ${{ runner.temp }}/rushes-intel-environment/*/command.exit
            ${{ runner.temp }}/rushes-intel-environment/*/retirement.json
            ${{ runner.temp }}/rushes-intel-environment/*/owned-browser-pid.json
            ${{ runner.temp }}/rushes-intel-environment/*/supplied-reference.f32le
            ${{ runner.temp }}/rushes-intel-environment/*/chrome-stderr.log
            ${{ runner.temp }}/rushes-intel-environment/*/normal-stop/*.webm
