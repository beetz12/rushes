name: ci

on:
  push:
    branches: [main, codex/browser-production-20261022]
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    name: check.sh (build, tests, clean-room, notices)
    runs-on: macos-latest
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Select the newest available Xcode
        run: |
          XL=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$XL"
          xcodebuild -version
          swift --version
      - name: Install the pinned Node runtimes
        run: |
          # macos-latest does not ship nvm. check.sh reads each .nvmrc and
          # requires that exact build at ~/.nvm/versions/node/v<pin>/bin.
          # nvm v0.40.8, pinned to the commit rather than the movable tag.
          export NVM_DIR="$HOME/.nvm"
          nvm_sha=a885b885fef16fac4bc544188fb25e9e37ae83e8
          if [ ! -s "$NVM_DIR/nvm.sh" ]; then
            mkdir -p "$NVM_DIR"
            git -C "$NVM_DIR" init -q
            git -C "$NVM_DIR" remote add origin https://github.com/nvm-sh/nvm.git
            git -C "$NVM_DIR" fetch --depth 1 origin "$nvm_sha"
            git -C "$NVM_DIR" checkout --detach FETCH_HEAD
          fi
          test "$(git -C "$NVM_DIR" rev-parse HEAD)" = "$nvm_sha"
          # nvm.sh returns non-zero while it is being sourced under `set -e`.
          set +e
          # shellcheck disable=SC1091
          . "$NVM_DIR/nvm.sh"
          set -e
          command -v nvm >/dev/null
          for pin in $(cat */.nvmrc 2>/dev/null | sort -u); do
            echo "nvm install $pin"
            nvm install "$pin"
            bare="${pin#v}"
            test -x "$NVM_DIR/versions/node/v$bare/bin/node"
            "$NVM_DIR/versions/node/v$bare/bin/node" --version
          done
      - name: Install media verification tools
        run: |
          brew list ffmpeg >/dev/null 2>&1 || brew install ffmpeg
          ffmpeg -version
          ffprobe -version
      - name: Gate
        env:
          RUSHES_M1_PROOF: ${{ runner.temp }}/rushes-browser-proof
        run: |
          set -euo pipefail
          bash scripts/check.sh 2>&1 | tee "$RUNNER_TEMP/rushes-source-gate.log"
      - name: Preserve generated browser failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-source-gate-evidence
          retention-days: 1
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/rushes-browser-proof/capture-cold.log
            ${{ runner.temp }}/rushes-browser-proof/capture-cold-*.webm
      - name: Collect only owned engine crash stack metadata
        if: always()
        run: |
          if [ -x .build/debug/rushcore-engine ] && [ -f "$RUNNER_TEMP/rushes-source-gate.log" ]; then
            python3 verification/engine_crash_report.py --log "$RUNNER_TEMP/rushes-source-gate.log" --engine .build/debug/rushcore-engine --output "$RUNNER_TEMP/rushes-owned-crash.json"
          else
            echo '{"availability":"unavailable","reason":"built engine or gate log absent"}' > "$RUNNER_TEMP/rushes-owned-crash.json"
          fi
          # Keep the already-redacted stack with the run log as well: a short
          # artifact expiry must not erase the only evidence of a native crash.
          cat "$RUNNER_TEMP/rushes-owned-crash.json"
      - name: Preserve bounded generated-engine stack metadata
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: owned-engine-crash-metadata
          path: ${{ runner.temp }}/rushes-owned-crash.json
          retention-days: 1
          if-no-files-found: warn


  smoke:
    name: release engine + CLI smoke (stub capture)
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Select the newest available Xcode
        run: |
          XL=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$XL"
          xcodebuild -version
          swift --version
      - name: Build release binaries
        run: swift build -c release
      - name: Engine + CLI over a real socket
        run: |
          set -euo pipefail
          SOCK="$RUNNER_TEMP/rushes.sock"
          .build/release/rushcore-engine \
            --socket-path "$SOCK" \
            --recordings-root "$RUNNER_TEMP/rushes-recordings" \
            --index-path "$RUNNER_TEMP/rushes-index.sqlite" \
            --capture-stub &
          ENGINE=$!
          trap 'kill $ENGINE 2>/dev/null || true' EXIT
          sleep 3
          .build/release/rushes --socket "$SOCK" guide --json > guide.json
          python3 - <<'PY'
          import json
          guide = json.load(open("guide.json"))
          assert guide.get("commands"), "guide listed no commands"
          print("guide ok:", len(guide["commands"]), "commands")
          PY
          .build/release/rushes --socket "$SOCK" targets > targets.json
          python3 - <<'PY'
          import json
          t = json.load(open("targets.json"))
          assert t.get("displays"), "no displays listed"
          print("targets ok:", len(t["displays"]), "displays")
          PY
          # --wait streams NDJSON events and ends with the done envelope;
          # parse every line and take the recording id from any event/result.
          .build/release/rushes --socket "$SOCK" record start --display main --mic default --duration 2 --wait > record.ndjson
          python3 - <<'PY'
          import json
          def find_id(o):
              if isinstance(o, dict):
                  if isinstance(o.get("id"), str) and len(o.get("id", "")) > 8:
                      return o["id"]
                  for v in o.values():
                      r = find_id(v)
                      if r: return r
              elif isinstance(o, list):
                  for v in o:
                      r = find_id(v)
                      if r: return r
              return None
          rid = None
          for line in open("record.ndjson"):
              line = line.strip()
              if not line:
                  continue
              rid = find_id(json.loads(line)) or rid
          assert rid, "no recording id in record output"
          open("rid.txt", "w").write(rid)
          print("recorded:", rid)
          PY
          .build/release/rushes --socket "$SOCK" verify "$(cat rid.txt)" > verify.json
          cat verify.json
