name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    name: check.sh (build, tests, clean-room, notices)
    runs-on: macos-latest
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Select the newest available Xcode
        run: |
          XL=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$XL"
          xcodebuild -version
          swift --version
      - name: Install the pinned Node runtimes
        run: |
          # macos-latest does not ship nvm. check.sh reads each .nvmrc and
          # requires that exact build at ~/.nvm/versions/node/v<pin>/bin.
          export NVM_DIR="$HOME/.nvm"
          if [ ! -s "$NVM_DIR/nvm.sh" ]; then
            git clone --depth 1 --branch v0.40.8 https://github.com/nvm-sh/nvm.git "$NVM_DIR"
          fi
          # nvm.sh returns non-zero while it is being sourced under `set -e`.
          set +e
          # shellcheck disable=SC1091
          . "$NVM_DIR/nvm.sh"
          set -e
          command -v nvm >/dev/null
          for pin in $(cat */.nvmrc 2>/dev/null | sort -u); do
            echo "nvm install $pin"
            nvm install "$pin"
            bare="${pin#v}"
            test -x "$NVM_DIR/versions/node/v$bare/bin/node"
            "$NVM_DIR/versions/node/v$bare/bin/node" --version
          done
      - name: Gate
        run: bash scripts/check.sh

  smoke:
    name: release engine + CLI smoke (stub capture)
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Select the newest available Xcode
        run: |
          XL=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$XL"
          xcodebuild -version
          swift --version
      - name: Build release binaries
        run: swift build -c release
      - name: Engine + CLI over a real socket
        run: |
          set -euo pipefail
          SOCK="$RUNNER_TEMP/rushes.sock"
          .build/release/rushcore-engine \
            --socket-path "$SOCK" \
            --recordings-root "$RUNNER_TEMP/rushes-recordings" \
            --index-path "$RUNNER_TEMP/rushes-index.sqlite" \
            --capture-stub &
          ENGINE=$!
          trap 'kill $ENGINE 2>/dev/null || true' EXIT
          sleep 3
          .build/release/rushes --socket "$SOCK" guide --json > guide.json
          python3 - <<'PY'
          import json
          guide = json.load(open("guide.json"))
          assert guide.get("commands"), "guide listed no commands"
          print("guide ok:", len(guide["commands"]), "commands")
          PY
          .build/release/rushes --socket "$SOCK" targets > targets.json
          python3 - <<'PY'
          import json
          t = json.load(open("targets.json"))
          assert t.get("displays"), "no displays listed"
          print("targets ok:", len(t["displays"]), "displays")
          PY
          # --wait streams NDJSON events and ends with the done envelope;
          # parse every line and take the recording id from any event/result.
          .build/release/rushes --socket "$SOCK" record start --display main --mic default --duration 2 --wait > record.ndjson
          python3 - <<'PY'
          import json
          def find_id(o):
              if isinstance(o, dict):
                  if isinstance(o.get("id"), str) and len(o.get("id", "")) > 8:
                      return o["id"]
                  for v in o.values():
                      r = find_id(v)
                      if r: return r
              elif isinstance(o, list):
                  for v in o:
                      r = find_id(v)
                      if r: return r
              return None
          rid = None
          for line in open("record.ndjson"):
              line = line.strip()
              if not line:
                  continue
              rid = find_id(json.loads(line)) or rid
          assert rid, "no recording id in record output"
          open("rid.txt", "w").write(rid)
          print("recorded:", rid)
          PY
          .build/release/rushes --socket "$SOCK" verify "$(cat rid.txt)" > verify.json
          cat verify.json
