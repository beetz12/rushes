name: mas-feasibility

on:
  push:
    branches: [codex/mas-feasibility-20261025]
  pull_request:
    paths:
      - 'scripts/mas-spike/**'
      - 'verification/mas-spike/**'
      - '.github/workflows/mas-feasibility.yml'

permissions:
  contents: read

jobs:
  sandbox-spike:
    if: github.repository == 'beetz12/rushes' && github.event.repository.private == false
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Select the newest available Xcode
        run: |
          XL=$(printf '%s\n' /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$XL"
          swift --version
      - name: Install the pinned Node runtimes
        run: |
          # macos-latest does not ship nvm. check.sh reads each .nvmrc and
          # requires that exact build at ~/.nvm/versions/node/v<pin>/bin.
          # nvm v0.40.8, pinned to the commit rather than the movable tag.
          export NVM_DIR="$HOME/.nvm"
          nvm_sha=a885b885fef16fac4bc544188fb25e9e37ae83e8
          if [ ! -s "$NVM_DIR/nvm.sh" ]; then
            mkdir -p "$NVM_DIR"
            git -C "$NVM_DIR" init -q
            git -C "$NVM_DIR" remote add origin https://github.com/nvm-sh/nvm.git
            git -C "$NVM_DIR" fetch --depth 1 origin "$nvm_sha"
            git -C "$NVM_DIR" checkout --detach FETCH_HEAD
          fi
          test "$(git -C "$NVM_DIR" rev-parse HEAD)" = "$nvm_sha"
          # nvm.sh returns non-zero while it is being sourced under `set -e`.
          set +e
          # shellcheck disable=SC1091
          . "$NVM_DIR/nvm.sh"
          set -e
          command -v nvm >/dev/null
          while IFS= read -r pin; do
            echo "nvm install $pin"
            nvm install "$pin"
            bare="${pin#v}"
            test -x "$NVM_DIR/versions/node/v$bare/bin/node"
            "$NVM_DIR/versions/node/v$bare/bin/node" --version
          done < <(cat ./*/.nvmrc | sort -u)
      - name: Install media verification tools
        run: |
          brew list ffmpeg >/dev/null 2>&1 || brew install ffmpeg
          ffmpeg -version
          ffprobe -version
      - name: Source gate and enforced native sandbox diagnostic
        env:
          RUSHES_MAS_EVIDENCE_DIR: ${{ runner.temp }}/rushes-mas-spike.noindex
          RUSHES_FINALIZE_TRACE: '1'
        run: python3 scripts/mas-spike/check.py
      - name: Preserve generated diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: generated-mas-feasibility
          path: |
            ${{ runner.temp }}/rushes-mas-spike.noindex/**/*.json
            ${{ runner.temp }}/rushes-mas-spike.noindex/**/*.log
            ${{ runner.temp }}/rushes-mas-spike.noindex/**/*.stdout
            ${{ runner.temp }}/rushes-mas-spike.noindex/**/*.stderr
          retention-days: 3
