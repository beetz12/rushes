name: mac-web-viewing
on:
  push:
    branches: [main, codex/mac-web-release-20261024]
  pull_request:
permissions:
  contents: read
concurrency:
  group: web-viewing-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  viewing:
    if: github.repository == 'beetz12/rushes' && github.event.repository.private == false
    name: Web library and playback / ${{ matrix.os }} / ${{ matrix.engine }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            engine: chromium
          - os: windows-latest
            engine: chromium
          - os: macos-latest
            engine: webkit
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.0
      - name: Install shared web dependencies
        run: npm --prefix browser ci --no-audit --no-fund
      - name: Isolated pinned Chrome for shared web regressions
        run: node scripts/install-test-chrome.mjs --generation current --destination "${{ runner.temp }}/rushes-web-chrome"
      - name: Install WebKit for Mac viewing
        if: matrix.engine == 'webkit'
        run: npm --prefix browser exec -- playwright install webkit
      - name: Install media oracle tools on Mac
        if: runner.os == 'macOS'
        run: |
          brew list ffmpeg >/dev/null 2>&1 || brew install ffmpeg
          ffmpeg -version
          ffprobe -version
      - name: Install and resolve media oracle tools on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --no-progress -y
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            $binary = Get-ChildItem "$env:ChocolateyInstall/lib/ffmpeg/tools" -Filter ffmpeg.exe -Recurse | Select-Object -First 1
            if (-not $binary) { throw 'Installed FFmpeg executable was not found' }
            $directory = $binary.DirectoryName
            $directory | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
            $env:PATH = "$directory;$env:PATH"
          }
          ffmpeg -version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ffprobe -version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build the shipped library entry
        run: npm --prefix browser run build
      - name: Shipped web and shared account/library/billing regressions
        env:
          RUSHES_TEST_BROWSER: ${{ matrix.engine }}
          RUSHES_WEB_PROOF: ${{ runner.temp }}/rushes-web-proof
          RUSHES_UI_PROOF: ${{ runner.temp }}/rushes-shared-web-proof
        run: npm --prefix browser run test:web
      - name: Preserve generated UI evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: web-viewing-${{ matrix.os }}-${{ matrix.engine }}
          retention-days: 1
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/rushes-web-proof/*.png
            ${{ runner.temp }}/rushes-web-proof/*.json
            ${{ runner.temp }}/rushes-shared-web-proof/*.json
